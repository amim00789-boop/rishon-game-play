<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rishon</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd8ff;
               font-family: "Rubik", "Nunito", "Trebuchet MS", system-ui, sans-serif; }
  /* Key caps stay left-to-right inside Hebrew sentences. */
  kbd { display: inline-block; unicode-bidi: isolate; direction: ltr; font: inherit; font-weight: 800; font-size: 0.9em;
        padding: 0 5px; border: 1.5px solid rgba(35, 50, 74, 0.55); border-radius: 5px; background: rgba(255, 255, 255, 0.7);
        line-height: 1.25; }
  .hud-panel { text-align: start; }
  canvas#game { display: block; outline: none; touch-action: none; }
  .hud-panel { position: fixed; color: #23324a; background: rgba(255, 252, 244, 0.86);
               border: 2px solid rgba(35, 50, 74, 0.85); border-radius: 12px;
               box-shadow: 0 3px 0 rgba(35, 50, 74, 0.35); user-select: none; pointer-events: none; }
  #hud-mode { left: 14px; top: 14px; padding: 8px 12px; font-size: 13px; line-height: 1.5; max-width: 440px; }
  #hud-mode .modes { white-space: nowrap; }
  #hud-mode .mode { font-size: 18px; font-weight: 800; letter-spacing: 0.3px; }
  #hud-mode .modes span { display: inline-block; margin-inline-end: 6px; padding: 0 6px; border-radius: 6px;
                          background: rgba(35, 50, 74, 0.08); }
  #hud-mode .modes span.on { background: #ffb347; color: #23324a; font-weight: 800; }
  #hud-mode .hint { opacity: 0.8; font-size: 12px; }
  #hud-fps { right: 14px; top: 14px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
  #hud-map { right: 14px; bottom: 30px; padding: 0; overflow: hidden; border-radius: 16px; }
  #hud-map canvas { display: block; }
  #hud-attrib { position: fixed; right: 14px; bottom: 6px; font-size: 11px; color: #23324a;
                background: rgba(255, 252, 244, 0.7); padding: 1px 6px; border-radius: 6px; user-select: none; }
  #hud-attrib a { color: inherit; }
  #hud-toast { left: 50%; top: 18px; transform: translateX(-50%); padding: 6px 14px; font-size: 15px;
               font-weight: 800; opacity: 0; transition: opacity 0.25s; }
  #hud-clues { right: 14px; top: 190px; width: 240px; max-height: 40vh; overflow-y: auto; padding: 8px 12px; font-size: 12px; line-height: 1.4; }
  #hud-clues b { display: block; margin-bottom: 4px; }
  #hud-clues .nudge { margin-top: 6px; font-weight: 800; color: #1a7f75; }
  #hud-quest { right: 14px; top: 46px; width: 240px; padding: 8px 12px; font-size: 13px; line-height: 1.35; }
  #hud-quest .hum { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; margin-bottom: 6px; }
  #hud-quest .hum-bar { flex: 1; height: 8px; border: 2px solid #23324a; border-radius: 6px; background: #fff8ea; overflow: hidden; }
  #hud-quest .hum-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #b36bd6, #e8364f); transition: width 1.2s; }
  #hud-quest .q-title { font-size: 15px; font-weight: 900; }
  #hud-quest .q-text { margin: 2px 0 4px; }
  #hud-quest .q-dist, #hud-quest .q-prog { unicode-bidi: isolate; }
  #hud-quest .q-meta { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 12px; }
  #hud-quest .q-arrow { display: inline-block; width: 18px; height: 18px; line-height: 18px; text-align: center;
                        border-radius: 50%; background: #2ec4b6; color: #23324a; font-size: 13px; }
  #hud-quest.giver .q-arrow { background: #ffcb3d; }
  #hud-dialogue { left: 50%; bottom: 34px; transform: translateX(-50%) translateY(16px); width: min(640px, calc(100vw - 32px));
                  box-sizing: border-box; padding: 12px 16px 10px; font-size: 17px; line-height: 1.45; opacity: 0;
                  transition: opacity 0.18s, transform 0.18s; pointer-events: none; }
  #hud-dialogue.on { opacity: 1; transform: translateX(-50%); pointer-events: auto; cursor: pointer; }
  #hud-dialogue .who { display: inline-block; margin-block: -26px 6px; margin-inline-start: -4px; padding: 2px 10px; background: #ffb347;
                       border: 2px solid #23324a; border-radius: 8px; font-weight: 900; font-size: 15px; }
  #hud-dialogue.player .who { background: #7fe0d6; }
  #hud-dialogue.narrator .line { font-style: italic; opacity: 0.9; }
  #hud-dialogue .opts { margin: 8px 0 2px; padding: 0; list-style: none; }
  #hud-dialogue .opts li { margin: 4px 0; padding: 5px 10px; border: 2px solid rgba(35, 50, 74, 0.35); border-radius: 9px;
                           background: rgba(255, 255, 255, 0.75); font-size: 15px; cursor: pointer; }
  #hud-dialogue .opts li:hover { background: #ffe3b0; border-color: #23324a; }
  #hud-dialogue .next { margin-top: 6px; font-size: 12px; font-weight: 800; opacity: 0.6; text-align: end; }
  #hud-prompt { left: 50%; bottom: 120px; transform: translateX(-50%); padding: 6px 14px; font-size: 15px; font-weight: 900;
                background: #ffcb3d; opacity: 0; transition: opacity 0.15s; }
  #hud-prompt.on { opacity: 1; }
  #hud-banner { left: 50%; top: 22%; transform: translateX(-50%) scale(0.92); padding: 12px 26px; text-align: center;
                max-width: min(560px, calc(100vw - 32px)); box-sizing: border-box; opacity: 0; transition: opacity 0.3s, transform 0.3s; }
  #hud-banner.on { opacity: 1; transform: translateX(-50%) scale(1); }
  #hud-banner .b-title { font-size: 13px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; color: #e8364f; }
  #hud-banner .b-sub { font-size: 26px; font-weight: 900; }
  #hud-banner .b-extra { margin-top: 6px; font-size: 14px; }
  @media (max-width: 720px), (max-height: 520px) {
    #hud-quest { width: 190px; font-size: 12px; }
    #hud-map { transform: scale(0.65); transform-origin: bottom right; }
    #hud-mode .hint, #hud-mode .modes { display: none; }
  }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: 14px; z-index: 10;
             background: linear-gradient(#7cc8f5 0%, #bfe6ff 55%, #ffe3b0 100%); color: #23324a;
             transition: opacity 0.6s; }
  #loading h1 { margin: 0; font-size: 44px; font-weight: 900; letter-spacing: 1px;
                text-shadow: 0 4px 0 rgba(255, 255, 255, 0.8); }
  #loading .bar { width: 260px; height: 16px; border: 3px solid #23324a; border-radius: 10px;
                  background: #fff8ea; overflow: hidden; }
  #loading .fill { height: 100%; width: 0%; background: #ffb347; transition: width 0.3s; }
  #loading .msg { font-size: 14px; font-weight: 700; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<!-- Start the CDN downloads with the page instead of after main.js asks for them (cold load). -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/geometries/RoundedBoxGeometry.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/utils/BufferGeometryUtils.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/RenderPass.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/ShaderPass.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/OutputPass.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/Pass.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/MaskPass.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/shaders/CopyShader.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/shaders/FXAAShader.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/shaders/OutputShader.js" crossorigin>
<link rel="modulepreload" href="src/main.js">
</head>
<body>
<div id="loading">
  <h1>RISHON</h1>
  <div class="bar"><div class="fill" id="loading-fill"></div></div>
  <div class="msg" id="loading-msg">Loading...</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
